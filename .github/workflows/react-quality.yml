name: React Dashboard Quality

on:
  push:
    branches: [main, development]
    paths:
      - 'source/app-board/**'
  pull_request:
    branches: [main, development]
    paths:
      - 'source/app-board/**'
  workflow_dispatch:

jobs:
  react-ci:
    name: Lint & Build React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/app-board
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: source/app-board/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        # check code style based on rules of the .eslintrc.json
        run: npx eslint . --ext .js,.jsx

      - name: Build Check
        # check the build
        run: npm run build